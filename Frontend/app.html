<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINAG | Laguna Solar Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        .solar-gradient {
            background: linear-gradient(135deg, #fde047 0%, #fbbf24 50%, #f59e0b 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .map-container {
            background-image: url('https://api.mapbox.com/styles/v1/mapbox/satellite-v9/static/121.1114,14.3146,15,0/800x600?access_token=pk.eyJ1IjoiZGV2ZWxvcGVyIiwiYSI6ImNsZndndmpxMDAxYXQzcXBlbm96bnZ6bmcifQ');
            background-size: cover;
            background-position: center;
        }

        .heatmap-overlay {
            background: radial-gradient(circle at 40% 40%, rgba(251, 191, 36, 0.4) 0%, transparent 20%),
                        radial-gradient(circle at 60% 50%, rgba(251, 191, 36, 0.3) 0%, transparent 15%),
                        radial-gradient(circle at 30% 70%, rgba(34, 197, 94, 0.3) 0%, transparent 25%);
        }

        @keyframes pulse-sun {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .sun-loader {
            animation: pulse-sun 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = ({ currentView, setView }) => (
            <nav className="fixed top-0 w-full z-50 glass-card px-6 py-4 flex justify-between items-center shadow-sm">
                <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('landing')}>
                    <div className="w-8 h-8 solar-gradient rounded-full flex items-center justify-center text-white font-bold">S</div>
                    <span className="text-2xl font-extrabold tracking-tight text-slate-800">SINAG</span>
                </div>
                <div className="flex gap-6 items-center">
                    <button 
                        onClick={() => setView('landing')}
                        className={`text-sm font-semibold ${currentView !== 'business' ? 'text-amber-600' : 'text-slate-500'}`}
                    >
                        Consumer View
                    </button>
                    <button 
                        onClick={() => setView('business')}
                        className={`px-4 py-2 rounded-full text-sm font-bold transition-all ${currentView === 'business' ? 'bg-slate-900 text-white' : 'border-2 border-slate-900 text-slate-900 hover:bg-slate-900 hover:text-white'}`}
                    >
                        Business View
                    </button>
                </div>
            </nav>
        );

        const LandingPage = ({ onStart }) => (
            <div className="min-h-screen pt-20 flex flex-col items-center justify-center text-center px-4">
                <div className="max-w-4xl">
                    <span className="bg-amber-100 text-amber-700 px-4 py-1 rounded-full text-sm font-bold mb-6 inline-block">
                        🇵🇭 Empowering Laguna's Solar Future
                    </span>
                    <h1 className="text-6xl md:text-7xl font-extrabold text-slate-900 mb-6 leading-tight">
                        Ilawan ang iyong <br />
                        <span className="text-transparent bg-clip-text solar-gradient">kinabukasan.</span>
                    </h1>
                    <p className="text-xl text-slate-600 mb-10 max-w-2xl mx-auto">
                        SINAG uses GeoAI to measure your roof's solar potential in seconds. Reduce your bills and help the planet, one rooftop at a time.
                    </p>
                    
                    <div className="relative max-w-xl mx-auto mb-16">
                        <input 
                            type="text" 
                            placeholder="Enter your address in Laguna (e.g. Santa Rosa, Biñan...)" 
                            className="w-full px-8 py-6 rounded-full shadow-2xl border-none focus:ring-4 focus:ring-amber-300 text-lg outline-none"
                        />
                        <button 
                            onClick={onStart}
                            className="absolute right-3 top-3 bottom-3 px-8 solar-gradient text-white font-bold rounded-full hover:shadow-lg transition-all"
                        >
                            Find My Roof
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8 text-left">
                        <div className="p-6 bg-white rounded-3xl shadow-sm border border-slate-100">
                            <i className="fa-solid fa-bolt text-amber-500 text-2xl mb-4"></i>
                            <h3 className="font-bold text-lg mb-2">Cut Bills by 60%</h3>
                            <p className="text-slate-500 text-sm">Automated ROI calculation based on Meralco rates.</p>
                        </div>
                        <div className="p-6 bg-white rounded-3xl shadow-sm border border-slate-100">
                            <i className="fa-solid fa-leaf text-green-500 text-2xl mb-4"></i>
                            <h3 className="font-bold text-lg mb-2">Zero Emissions</h3>
                            <p className="text-slate-500 text-sm">Measure your household's contribution to climate action.</p>
                        </div>
                        <div className="p-6 bg-white rounded-3xl shadow-sm border border-slate-100">
                            <i className="fa-solid fa-microchip text-blue-500 text-2xl mb-4"></i>
                            <h3 className="font-bold text-lg mb-2">GeoAI Precision</h3>
                            <p className="text-slate-500 text-sm">NASA-grade solar tracking for your specific rooftop.</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const MapSelector = ({ onPin }) => (
            <div className="min-h-screen pt-24 pb-12 px-6 flex flex-col items-center">
                <div className="max-w-5xl w-full text-center mb-8">
                    <h2 className="text-3xl font-bold mb-2">Pin Your Household</h2>
                    <p className="text-slate-500">Move the map and click exactly where your roof is to begin the AI audit.</p>
                </div>
                <div className="w-full max-w-5xl h-[500px] rounded-3xl shadow-2xl relative map-container overflow-hidden group cursor-crosshair" onClick={onPin}>
                    <div className="absolute inset-0 bg-black opacity-10 group-hover:opacity-0 transition-opacity"></div>
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-full text-amber-500 text-5xl">
                        <i className="fa-solid fa-location-dot drop-shadow-lg"></i>
                    </div>
                    <div className="absolute bottom-6 right-6 bg-white px-4 py-2 rounded-lg font-bold shadow-md">
                        Satellite View: Santa Rosa, Laguna
                    </div>
                </div>
            </div>
        );

        const LoadingScreen = ({ onComplete }) => {
            useEffect(() => {
                const timer = setTimeout(onComplete, 3000);
                return () => clearTimeout(timer);
            }, []);

            return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-white">
                    <div className="w-32 h-32 solar-gradient rounded-full sun-loader flex items-center justify-center text-white text-5xl mb-8">
                        <i className="fa-solid fa-sun"></i>
                    </div>
                    <h2 className="text-2xl font-bold mb-2">Analyzing Your Rooftop...</h2>
                    <p className="text-slate-400 animate-pulse italic">Scanning footprints via Google Open Buildings</p>
                </div>
            );
        };

        const ConsumerResults = () => (
            <div className="min-h-screen pt-28 pb-20 px-6">
                <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div className="lg:col-span-2">
                        <div className="bg-white p-8 rounded-3xl shadow-xl border border-slate-100 mb-8">
                            <div className="flex justify-between items-start mb-8">
                                <div>
                                    <h1 className="text-4xl font-extrabold mb-2">Your Solar Report</h1>
                                    <p className="text-slate-500"><i className="fa-solid fa-location-dot mr-2"></i>Lot 42, Brgy. Don Jose, Santa Rosa, Laguna</p>
                                </div>
                                <div className="text-right">
                                    <div className="text-3xl font-black text-amber-500">A+</div>
                                    <div className="text-xs font-bold text-slate-400 uppercase tracking-widest">Readiness Score</div>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                                <div className="bg-slate-50 p-4 rounded-2xl">
                                    <span className="text-xs text-slate-400 font-bold uppercase">Usable Area</span>
                                    <p className="text-xl font-bold">85.4 m²</p>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-2xl">
                                    <span className="text-xs text-slate-400 font-bold uppercase">System Size</span>
                                    <p className="text-xl font-bold">12.5 kWp</p>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-2xl">
                                    <span className="text-xs text-slate-400 font-bold uppercase">Annual Yield</span>
                                    <p className="text-xl font-bold">18.2 MWh</p>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-2xl">
                                    <span className="text-xs text-slate-400 font-bold uppercase">Roof Tilt</span>
                                    <p className="text-xl font-bold">22.5°</p>
                                </div>
                            </div>

                            <div className="h-64 bg-slate-100 rounded-2xl flex items-center justify-center overflow-hidden mb-8">
                                <img src="https://api.mapbox.com/styles/v1/mapbox/satellite-v9/static/121.1114,14.3146,18,0/800x400?access_token=pk.eyJ1IjoiZGV2ZWxvcGVyIiwiYSI6ImNsZndndmpxMDAxYXQzcXBlbm96bnZ6bmcifQ" className="w-full h-full object-cover" />
                            </div>
                        </div>
                    </div>

                    <div className="space-y-6">
                        <div className="solar-gradient p-8 rounded-3xl text-white shadow-xl shadow-amber-200">
                            <h3 className="text-2xl font-bold mb-6">Financial Impact</h3>
                            <div className="space-y-4 mb-8">
                                <div className="flex justify-between border-b border-white/20 pb-2">
                                    <span>Monthly Savings</span>
                                    <span className="font-bold">₱8,450.00</span>
                                </div>
                                <div className="flex justify-between border-b border-white/20 pb-2">
                                    <span>Payback Period</span>
                                    <span className="font-bold">4.2 Years</span>
                                </div>
                                <div className="flex justify-between border-b border-white/20 pb-2">
                                    <span>25-Year Savings</span>
                                    <span className="font-bold">₱2.4M+</span>
                                </div>
                            </div>
                            <button className="w-full bg-white text-amber-600 font-bold py-4 rounded-2xl shadow-lg hover:bg-slate-50 transition-colors">
                                Get Installer Quotes
                            </button>
                        </div>

                        <div className="bg-slate-900 p-8 rounded-3xl text-white">
                            <h3 className="font-bold mb-4">Environmental Impact</h3>
                            <div className="flex items-center gap-4 mb-4">
                                <div className="w-12 h-12 bg-green-500 rounded-full flex items-center justify-center text-xl">
                                    <i className="fa-solid fa-tree"></i>
                                </div>
                                <div>
                                    <p className="text-sm opacity-70">Equivalent to</p>
                                    <p className="font-bold">420 Trees Planted / Year</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center text-xl">
                                    <i className="fa-solid fa-car"></i>
                                </div>
                                <div>
                                    <p className="text-sm opacity-70">Carbon Offset</p>
                                    <p className="font-bold">12.4 Tons of CO2</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const BusinessDashboard = () => (
            <div className="min-h-screen bg-slate-950 pt-24 pb-12 px-8 text-white">
                <div className="flex justify-between items-end mb-10">
                    <div>
                        <h1 className="text-4xl font-extrabold mb-2 text-amber-400">Regional Intelligence</h1>
                        <p className="text-slate-400 font-medium">Laguna Province Multi-Scalar Audit Summary</p>
                    </div>
                    <div className="flex gap-4">
                        <button className="bg-slate-800 px-5 py-2.5 rounded-xl font-bold text-sm hover:bg-slate-700 transition-all">
                            <i className="fa-solid fa-download mr-2"></i>Export CSV
                        </button>
                        <button className="bg-amber-500 px-5 py-2.5 rounded-xl font-bold text-sm text-slate-900 hover:bg-amber-400 transition-all shadow-lg shadow-amber-500/20">
                            Partner Portal
                        </button>
                    </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-4 gap-8 mb-10">
                    <div className="lg:col-span-3 bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden relative h-[500px] shadow-2xl">
                        {/* Mock Map with Heatmap Effect */}
                        <div className="absolute inset-0 map-container opacity-60"></div>
                        <div className="absolute inset-0 heatmap-overlay"></div>
                        
                        {/* Map UI Overlays */}
                        <div className="absolute top-6 left-6 flex flex-col gap-2">
                            <div className="bg-slate-900/90 backdrop-blur px-4 py-2 rounded-xl border border-slate-700 text-xs font-bold flex items-center gap-2">
                                <span className="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
                                LIVE FEED: LAGUNA GRID 1
                            </div>
                            <div className="bg-slate-900/90 backdrop-blur p-4 rounded-xl border border-slate-700">
                                <p className="text-[10px] text-slate-500 uppercase tracking-widest mb-2 font-black">Map Filters</p>
                                <div className="space-y-2">
                                    <label className="flex items-center gap-2 text-sm">
                                        <input type="checkbox" checked className="accent-amber-500" /> Potential Yield
                                    </label>
                                    <label className="flex items-center gap-2 text-sm">
                                        <input type="checkbox" checked className="accent-amber-500" /> Grid Overlays
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div className="absolute bottom-6 left-6 bg-slate-900/90 backdrop-blur p-4 rounded-2xl border border-slate-700">
                            <div className="flex items-center gap-4">
                                <div className="text-center">
                                    <p className="text-[10px] text-slate-500 uppercase font-black">Current View</p>
                                    <p className="font-bold text-amber-400">Santa Rosa City</p>
                                </div>
                                <div className="h-8 w-[1px] bg-slate-700"></div>
                                <div>
                                    <p className="text-[10px] text-slate-500 uppercase font-black">Hotspot Intensity</p>
                                    <div className="flex gap-1 mt-1">
                                        {[1,2,3,4,5].map(i => <div key={i} className={`h-1.5 w-6 rounded-full ${i < 4 ? 'bg-amber-500' : 'bg-slate-700'}`}></div>)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="space-y-6">
                        <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl">
                            <p className="text-xs font-bold text-slate-500 uppercase mb-2 tracking-widest">Total Identified</p>
                            <p className="text-4xl font-black text-white">1,420 <span className="text-sm font-normal text-slate-500">GWh</span></p>
                            <div className="mt-4 p-3 bg-green-500/10 rounded-xl flex items-center gap-3">
                                <i className="fa-solid fa-chart-line text-green-500"></i>
                                <span className="text-xs font-bold text-green-500">+12% Potential vs 2025</span>
                            </div>
                        </div>
                        <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl">
                            <p className="text-xs font-bold text-slate-500 uppercase mb-2 tracking-widest">Market Valuation</p>
                            <p className="text-4xl font-black text-white">₱4.8 <span className="text-sm font-normal text-slate-500">Billion</span></p>
                            <p className="text-xs text-slate-500 mt-2">Targetable Residential Assets</p>
                        </div>
                        <div className="bg-amber-500 p-6 rounded-3xl shadow-xl shadow-amber-500/10 text-slate-950">
                            <p className="text-xs font-black uppercase mb-1 opacity-60">Ready Lead Clusters</p>
                            <p className="text-4xl font-black italic">12,402</p>
                            <p className="text-xs font-bold mt-2">Households with >80% ROI Score</p>
                        </div>
                    </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div className="bg-slate-900 p-8 rounded-3xl border border-slate-800">
                        <h3 className="text-xl font-bold mb-6">LGU Sustainability Leaderboard</h3>
                        <div className="space-y-4">
                            {[
                                { name: "Santa Rosa", count: "12,400", potential: "142 MW", color: "bg-amber-500" },
                                { name: "Biñan", count: "9,850", potential: "110 MW", color: "bg-slate-700" },
                                { name: "Calamba", count: "8,200", potential: "95 MW", color: "bg-slate-700" },
                                { name: "Cabuyao", count: "5,400", potential: "62 MW", color: "bg-slate-700" }
                            ].map((lgu, i) => (
                                <div key={i} className="flex items-center gap-4">
                                    <div className="w-8 font-bold text-slate-600">#{i+1}</div>
                                    <div className="flex-1">
                                        <div className="flex justify-between mb-1">
                                            <span className="font-bold">{lgu.name}</span>
                                            <span className="text-slate-400">{lgu.potential}</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                            <div className={`${lgu.color} h-full`} style={{width: i === 0 ? '80%' : '50%'}}></div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="bg-slate-900 p-8 rounded-3xl border border-slate-800">
                        <h3 className="text-xl font-bold mb-6">Commercial Lead Opportunities</h3>
                        <table className="w-full text-left">
                            <thead>
                                <tr className="text-slate-500 text-xs uppercase">
                                    <th className="pb-4">District Cluster</th>
                                    <th className="pb-4">ROI Class</th>
                                    <th className="pb-4">Avail. Sqm</th>
                                    <th className="pb-4">Action</th>
                                </tr>
                            </thead>
                            <tbody className="text-sm font-medium">
                                <tr className="border-b border-slate-800">
                                    <td className="py-4">Santa Rosa Estates</td>
                                    <td className="py-4"><span className="text-green-500 bg-green-500/10 px-2 py-1 rounded">Prime</span></td>
                                    <td className="py-4">42,500 m²</td>
                                    <td className="py-4 text-amber-500 cursor-pointer">View Map</td>
                                </tr>
                                <tr className="border-b border-slate-800">
                                    <td className="py-4">Biñan Heights</td>
                                    <td className="py-4"><span className="text-amber-500 bg-amber-500/10 px-2 py-1 rounded">High</span></td>
                                    <td className="py-4">28,100 m²</td>
                                    <td className="py-4 text-amber-500 cursor-pointer">View Map</td>
                                </tr>
                                <tr>
                                    <td className="py-4">Canlubang Industrial</td>
                                    <td className="py-4"><span className="text-blue-500 bg-blue-500/10 px-2 py-1 rounded">Corporate</span></td>
                                    <td className="py-4">152,000 m²</td>
                                    <td className="py-4 text-amber-500 cursor-pointer">View Map</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [view, setView] = useState('landing');

            return (
                <div>
                    <Navbar currentView={view} setView={setView} />
                    {view === 'landing' && <LandingPage onStart={() => setView('consumer-map')} />}
                    {view === 'consumer-map' && <MapSelector onPin={() => setView('loading')} />}
                    {view === 'loading' && <LoadingScreen onComplete={() => setView('consumer-results')} />}
                    {view === 'consumer-results' && <ConsumerResults />}
                    {view === 'business' && <BusinessDashboard />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
